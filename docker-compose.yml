# Local PostgreSQL for development. The services themselves run with npm scripts.
# Apply the schema with `npm run db:migrate` once the database is up.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yuubet
      POSTGRES_PASSWORD: yuubet
      POSTGRES_DB: yuubet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
