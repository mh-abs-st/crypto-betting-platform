# Local PostgreSQL for development. The services themselves run with npm scripts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yuubet
      POSTGRES_PASSWORD: yuubet
      POSTGRES_DB: yuubet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
